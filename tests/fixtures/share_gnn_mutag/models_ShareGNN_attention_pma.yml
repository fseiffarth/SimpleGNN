# Same tail as models_ShareGNN_factorized_readout.yml, but the readout is
# PMA-style attention pooling: num_seeds learned query vectors cross-attend
# over the H=5 head embeddings via multi-head attention, and the seed outputs
# are flattened and projected to out_features.
models:
  - - { layer_type: invariant_based_convolution,
        bias: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 1,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        flatten: False,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
          {
            num: 3,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: attention_readout,
        variant: pma,
        num_seeds: 2,
        num_attention_heads: 2,
        head_embeddings: True,
        out_features: 4,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
