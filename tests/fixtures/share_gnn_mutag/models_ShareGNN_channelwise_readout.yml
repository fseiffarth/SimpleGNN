# ZINC-style tail with the head axis kept: multi-group aggregation with
# flatten: False -> channel_wise linear -> reshape -> MLP.
# The dense readout of the flattening variant learns a free weight per
# (head, feature, output) triple; here the aggregation keeps its (H, F)
# structure and the readout maps F per head, which is what
# specs/09-zinc-readout-and-architecture-improvements.md calls Stage B.
models:
  - - { layer_type: invariant_based_convolution,
        bias: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 1,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        flatten: False,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
          {
            num: 3,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: linear,
        mode: channel_wise,
        out_features: 4,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: reshape }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
