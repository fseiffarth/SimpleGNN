# Minimal ShareGNN architecture used by tests/test_share_gnn_mutag_integration.py.
# Uses cheap "primary" labels (no cycle enumeration/betweenness) and a short
# distance range so the smoke test runs quickly on real MUTAG data.
models:
  - - { layer_type: invariant_based_convolution,
        bias: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 1,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: layer_norm }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
