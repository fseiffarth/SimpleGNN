# Minimal hyperparameters used by tests/test_share_gnn_mutag_integration.py.
# A single epoch is enough to exercise the full train/eval loop; these tests
# check that the pipeline runs, not that the model converges.
device: cpu
mode: experiments
precision: double

optimizer:
  - Adam
loss:
  - CrossEntropyLoss
batch_size:
  - 8
learning_rate:
  - 0.01
epochs:
  - 1
early_stopping:
  enabled: False
  patience: 30
training_data_sampling: { type: 'default' }
input_features: {name: constant, value: 1.0}
save_best_model: True
share_gnn_forward: { batched: True }
