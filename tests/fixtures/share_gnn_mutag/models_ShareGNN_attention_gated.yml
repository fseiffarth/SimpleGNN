# Same tail as models_ShareGNN_factorized_readout.yml, but the readout is
# gated attention pooling over the H=5 head embeddings: each head is scored
# with w . (tanh(x V) * sigmoid(x U)), softmaxed over heads, and the weighted
# sum is projected to out_features.
models:
  - - { layer_type: invariant_based_convolution,
        bias: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 1,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        flatten: False,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
          {
            num: 3,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: attention_readout,
        variant: gated,
        attention_dim: 4,
        head_embeddings: True,
        out_features: 4,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
