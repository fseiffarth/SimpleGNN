# ShareGNN architecture used by tests/test_positional_encoding.py: the minimal
# MUTAG fixture with an invariant-based positional encoding layer in front and
# a pre-norm residual block on the convolution (specs/15).
models:
  - - { layer_type: invariant_based_positional_encoding,
        heads: [
          { num: 3, labels: { label_type: primary } },
          { labels: { label_type: wl_labeled, depth: 1 } },
        ],
    }
    - { layer_type: invariant_based_convolution,
        bias: True,
        residual: True,
        pre_layer_norm: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 2,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: layer_norm }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
