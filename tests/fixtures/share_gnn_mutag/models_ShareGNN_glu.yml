# Same tail as models_ShareGNN_mlp_after_reshape.yml, but the MLP after the
# reshape is a gated linear unit block. The GLU sits both at node level
# (between the convolution and the aggregation, dimension preserving with a
# residual connection) and at graph level after the reshape, so the fixture
# exercises both shape paths of the layer. The node-level block uses the
# 'swiglu' layer_type alias, the readout the canonical 'glu' with an explicit
# variant.
models:
  - - { layer_type: invariant_based_convolution,
        bias: True,
        activation: torch.nn.Identity(),
        heads: [
          {
            num: 1,
            bias: True,
            labels: {
              head: { label_type: primary },
              tail: { label_type: primary },
              bias: { label_type: primary },
            },
            properties:
              { name: distances, values: [1, 2] },
          },
        ],
    }
    - { layer_type: linear,
        out_features: 8,
        bias: True,
        activation: torch.nn.LeakyReLU(),
    }
    - { layer_type: swiglu,
        expansion: 2,
        bias: True,
        residual: True,
    }
    - { layer_type: layer_norm }
    - { layer_type: invariant_based_aggregation,
        activation: torch.nn.Identity(),
        bias: True,
        heads: [
          {
            num: 2,
            bias: True,
            labels: { label_type: primary },
          },
          {
            num: 3,
            bias: True,
            labels: { label_type: primary },
          },
        ],
    }
    - { layer_type: reshape }
    - { layer_type: glu,
        variant: geglu,
        hidden_features: 16,
        out_features: 4,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: linear,
        out_features: 2,
        bias: True,
        activation: torch.nn.Identity(),
    }
    - { layer_type: reshape }
