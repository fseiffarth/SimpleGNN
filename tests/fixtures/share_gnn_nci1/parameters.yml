# Hyperparameters for the NCI1 speed benchmark (tests/test_speed_share_gnn_nci1.py).
#
# device, precision, epochs, batch_size and share_gnn_forward.batched are
# overridden per benchmark run; everything else is shared by all four runs
# (cpu/gpu x unbatched/batched) so that they train exactly the same model on the
# same batches and their accuracies are directly comparable.
device: cpu
mode: experiments
precision: double

optimizer:
  - Adam
loss:
  - CrossEntropyLoss

batch_size:
  - 64
learning_rate:
  - 0.01
epochs:
  - 10

early_stopping:
  enabled: False
  patience: 30

training_data_sampling: { type: 'default' }

# no random_variation: both modes must see identical inputs, otherwise the
# accuracy comparison would measure input noise instead of the forward path
input_features: { name: constant, value: 1.0 }

# no checkpoint writing: it would add I/O to the measured epoch time
save_best_model: False

# NOTE: the shipped NCI1 splits (src/simplegnn/datasets/splits/standard/
# NCI1_splits.json) are a 10-fold CV over train/validation only -- their "test"
# lists are empty. The benchmark therefore compares train and validation
# accuracy; there is no test split to evaluate.
