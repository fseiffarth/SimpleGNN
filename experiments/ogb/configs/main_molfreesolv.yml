# ogbg-molfreesolv: hydration free energy, kcal/mol (642 molecules)
# Official OGB scaffold split (generated by `python -m simplegnn.utils.ogb_splits
# --dataset ogbg-molfreesolv`); the split file must exist before FrameworkMain is
# constructed, see the module docstring of simplegnn/utils/ogb_splits.py.
datasets:
  - {
      name: "ogbg-molfreesolv",
      source: "OGB_GraphProp",
      task: "graph_regression",
      # the split file provides a single official fold, not k-fold CV
      validation_folds: 1,
      paths: {
        data: "data/OGB/",
        labels: "data/OGB/labels/",
        properties: "data/OGB/properties/",
        results: "results/ogb/",
        models: "experiments/ogb/models_ogb_regression.yml",
        hyperparameters: "experiments/ogb/parameters_ogb_regression.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ogbg-molfreesolv_splits.json",
      }
  }
