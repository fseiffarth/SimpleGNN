# ogbg-molhiv overfitting sweep, arm A (rule_occurrence_threshold = 1).
#
# Same dataset/split as main_molhiv.yml; points at the sweep-specific model and
# hyperparameter files and at its own results root. The results root MUST differ
# between the two arms: results are written to <results>/<dataset>/ and the
# configuration ids restart at 0 per run, so a shared root would have arm B
# overwrite arm A.
#
# Official OGB scaffold split (generated by `python -m simplegnn.utils.ogb_splits
# --dataset ogbg-molhiv`); the split file must exist before FrameworkMain is
# constructed, see the module docstring of simplegnn/utils/ogb_splits.py.
datasets:
  - {
      name: "ogbg-molhiv",
      source: "OGB_GraphProp",
      task: "graph_classification",
      # the split file provides a single official fold, not k-fold CV
      validation_folds: 1,
      paths: {
        data: "data/OGB/",
        labels: "data/OGB/labels/",
        properties: "data/OGB/properties/",
        results: "results/ogb_molhiv_t1/",
        models: "experiments/ogb/models_ogb_molhiv.yml",
        hyperparameters: "experiments/ogb/parameters_ogb_molhiv_t1.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ogbg-molhiv_splits.json",
      }
  }
