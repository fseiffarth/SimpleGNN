# ogbg-molbbbp: blood-brain barrier penetration (2,039 molecules) -- OPTIMAL config arm.
# Same dataset/split as main_molbbbp.yml but pointing at the tuned
# models/parameters pair (see experiments/ogb/OPTIMAL_CONFIG.md). Writes to its
# own results root: configuration ids restart at 0 per run, so sharing
# results/ogb/ with the baseline arm would let one run overwrite the other.
# Official OGB scaffold split (generated by `python -m simplegnn.utils.ogb_splits
# --dataset ogbg-molbbbp`); the split file must exist before FrameworkMain is
# constructed, see the module docstring of simplegnn/utils/ogb_splits.py.
datasets:
  - {
      name: "ogbg-molbbbp",
      source: "OGB_GraphProp",
      task: "graph_classification",
      # the split file provides a single official fold, not k-fold CV
      validation_folds: 1,
      paths: {
        data: "data/OGB/",
        labels: "data/OGB/labels/",
        properties: "data/OGB/properties/",
        results: "results/ogb_optimal/",
        models: "experiments/ogb/models_ogb_optimal_classification.yml",
        hyperparameters: "experiments/ogb/parameters_ogb_optimal_classification.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ogbg-molbbbp_splits.json",
      }
  }
