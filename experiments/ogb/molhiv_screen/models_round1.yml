# molhiv screening round 1. See README.md in this folder.
# Generated from ../molhiv_ladder/models_trimmed.yml (r0-r4) and
# ../models_ogb_optimal_classification.yml (r5). Configuration ids follow
# this order:
#   0 r0_reference     ladder-2 t0 architecture (calibrates the 8-epoch screen)
#   1 r1_local_conv    every convolution distance head capped at 3
#   2 r2_two_conv      r1 plus a second convolution with distances <= 2
#   3 r3_no_encoder    no closed-walk encoder
#   4 r4_pool_wl1      pooling adds a WL-with-edges depth-1 head
#   5 r5_optimal_arch  residual pre-LN convolution with simple-cycle heads
#   6 r6_mean_pool     r0 with mean instead of sum pooling (reduce: mean)
models:
- - layer_type: invariant_based_positional_encoding
    concatenate_input: true
    heads:
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 2
        max_walk_length: 2
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 3
        max_walk_length: 3
    - num: 2
