# molhiv ladder 2, t4_batch256 (batch 64 -> 256). See README.md in this folder.
# Every stage has its own results root: configuration ids restart at 0 per run,
# so a shared root would overwrite the previous stage.
datasets:
  - {
      name: "ogbg-molhiv",
      source: "OGB_GraphProp",
      task: "graph_classification",
      # the split file provides a single official fold, not k-fold CV
      validation_folds: 1,
      # ten seeds for the best configuration (OGB reporting protocol)
      evaluation_run_number: 10,
      # each process holds its own rule tables for 41k graphs
      num_workers: 4,
      paths: {
        data: "data/OGB/",
        labels: "data/OGB/labels/",
        properties: "data/OGB/properties/",
        results: "results/ogb_molhiv_ladder2/t4_batch256/",
        models: "experiments/ogb/molhiv_ladder/models_trimmed.yml",
        hyperparameters: "experiments/ogb/molhiv_ladder2/parameters_t4_batch256.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ogbg-molhiv_splits.json",
      }
  }
