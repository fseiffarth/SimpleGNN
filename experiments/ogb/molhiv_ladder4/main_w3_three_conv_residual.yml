# molhiv ladder 4, w3_three_conv_residual (v4 + residual convolutions). See README.md in this folder.
# Same seeds (42-51) as ladder-3 v3, the reference for every stage.
datasets:
  - {
      name: "ogbg-molhiv",
      source: "OGB_GraphProp",
      task: "graph_classification",
      # the split file provides a single official fold, not k-fold CV
      validation_folds: 1,
      # ten seeds for the best configuration (OGB reporting protocol)
      evaluation_run_number: 10,
      # each process holds its own rule tables for 41k graphs
      num_workers: 4,
      paths: {
        data: "data/OGB/",
        labels: "data/OGB/labels/",
        properties: "data/OGB/properties/",
        results: "results/ogb_molhiv_ladder4/w3_three_conv_residual/",
        models: "experiments/ogb/molhiv_ladder4/models_three_conv_residual.yml",
        hyperparameters: "experiments/ogb/molhiv_ladder2/parameters_t0_reference.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ogbg-molhiv_splits.json",
      }
  }
