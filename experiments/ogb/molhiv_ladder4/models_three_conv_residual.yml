# molhiv ladder 4, w3_three_conv_residual. See README.md in this folder.
# ladder-3 models_local1_three_conv.yml (v4) with residual: true on all
# three convolutions, as in w1.
models:
- - layer_type: invariant_based_positional_encoding
    concatenate_input: true
    heads:
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 2
        max_walk_length: 2
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 3
        max_walk_length: 3
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 4
        max_walk_length: 4
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 5
        max_walk_length: 5
    - num: 2
      labels:
        label_type: [closed_walks, primary]
        min_walk_length: 6
        max_walk_length: 6
  - {layer_type: linear, out_features: 16, bias: true, activation: torch.nn.LeakyReLU()}
  - {layer_type: layer_norm}
  - layer_type: invariant_based_convolution
    bias: true
    residual: true
    activation: torch.nn.Identity()
    heads:
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: edge_label_distances
        values: [1]
        cutoff: 1
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled, depth: 0}
        tail: {label_type: wl_labeled, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled_edges, depth: 0}
        tail: {label_type: wl_labeled_edges, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        tail: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        tail: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
  - {layer_type: linear, out_features: 64, bias: true, activation: torch.nn.LeakyReLU()}
  - {layer_type: layer_norm}
  - layer_type: invariant_based_convolution
    bias: true
    residual: true
    activation: torch.nn.Identity()
    heads:
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: edge_label_distances
        values: [1]
        cutoff: 1
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled, depth: 0}
        tail: {label_type: wl_labeled, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled_edges, depth: 0}
        tail: {label_type: wl_labeled_edges, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        tail: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        tail: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
  - {layer_type: linear, out_features: 64, bias: true, activation: torch.nn.LeakyReLU()}
  - {layer_type: layer_norm}
  - layer_type: invariant_based_convolution
    bias: true
    residual: true
    activation: torch.nn.Identity()
    heads:
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: primary}
        tail: {label_type: primary}
        bias: {label_type: primary}
      properties:
        name: edge_label_distances
        values: [1]
        cutoff: 1
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled, depth: 0}
        tail: {label_type: wl_labeled, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: wl_labeled_edges, depth: 0}
        tail: {label_type: wl_labeled_edges, depth: 0}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        tail: {label_type: induced_cycles, min_cycle_length: 5, max_cycle_length: 5}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
    - num: 2
      bias: true
      labels:
        head: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        tail: {label_type: induced_cycles, min_cycle_length: 6, max_cycle_length: 6}
        bias: {label_type: primary}
      properties:
        name: distances
        values: [1]
  - {layer_type: linear, out_features: 64, bias: true, activation: torch.nn.LeakyReLU()}
  - {layer_type: layer_norm}
  - layer_type: invariant_based_aggregation
    bias: true
    activation: torch.nn.Identity()
    heads:
    - num: 4
      bias: true
      labels: {label_type: primary}
    - num: 4
      bias: true
      labels: {label_type: wl_labeled_edges, depth: 0}
    - num: 4
      bias: true
      labels:
        label_type: [induced_cycles, primary]
        min_cycle_length: 5
        max_cycle_length: 6
  - {layer_type: reshape}
  - {layer_type: layer_norm}
  - {layer_type: linear, out_features: 64, bias: true, activation: torch.nn.LeakyReLU()}
  - {layer_type: dropout, p: 0.5}
  - {layer_type: linear, out_features: 2, bias: true, activation: torch.nn.Identity()}
  - {layer_type: reshape}
