# Hyperparameters for the BREC expressiveness benchmark.
# See specs/21-brec-expressiveness-benchmark.md.
#
# IMPORTANT: the RPC runner (experiments/brec/main_brec.py) does NOT read the
# training hyperparameters from this file. The protocol fixes them, and
# main_brec.py hard-codes the reference implementation's values:
#   Adam(lr=1e-3, weight_decay=1e-5) + ReduceLROnPlateau,
#   CosineEmbeddingLoss(margin=0.0) with target -1, batch size 16, 50 epochs.
# `optimizer`, `loss`, `batch_size`, `learning_rate` and `epochs` below are kept
# only so the config is a valid framework config (and so a stray
# run_configurations() call would not crash); changing them changes nothing.
#
# What DOES matter here: device, precision, and input_features.
device: cpu
mode: experiments
precision: double
share_gnn_forward: { batched: True }

# --- ignored by the RPC runner (see above) ---
optimizer:
  - { type: 'Adam', weight_decay: 0.00001 }
loss:
  - MAE
batch_size:
  - 16
learning_rate:
  - 0.001
epochs:
  - 50
early_stopping:
  enabled: False
  patience: 50
scheduler: { type: 'ReduceLROnPlateau', factor: 0.5, patience: 10, min_lr: 0.00001 }
training_data_sampling: { type: 'default' }
# --- end ignored block ---

rule_occurrence_threshold: 1

weight_initialization: { convolution: { type: 'mean_aggregation', gain: 1.0, mean_ratio: 0.5 },
                         convolution_bias: { type: 'mean_aggregation', gain: 1.0, mean_ratio: 0.0 },
                         aggregation: { type: 'mean_aggregation', gain: 1.0, mean_ratio: 0.5 },
                         aggregation_bias: { type: 'mean_aggregation', gain: 1.0, mean_ratio: 0.0 },
                         positional_encoding: { type: 'normal', mean: 0.0, std: 0.1 } }

# MANDATORY for a valid BREC run: constant node features. BREC graphs are
# unlabeled, and the benchmark measures what the *architecture* can distinguish.
# Random node features (`random_variation:` here, as used by the share_gnn_basic
# example) would let any GNN separate any pair, inflating the score to 400/400
# while also breaking the reliability control — the isomorphic pair would be
# "distinguished" too. Do not add them.
input_features: { name: constant, in_dimensions: 1, value: 1.0 }
