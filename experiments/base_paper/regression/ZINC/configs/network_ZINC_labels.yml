# ZINC, step 3 of specs/09-zinc-readout-and-architecture-improvements.md:
# network_ZINC_small.yml plus the invariants the baseline leaves switched off.
#
#   * wl_labeled at depth 1 and 2 -- the baseline only uses depth 0, which
#     short-circuits to (atom type, degree), so real WL refinement never runs
#   * combined label types in the *convolution* heads ([primary, degree],
#     [primary, induced_cycles]); the baseline only combines in the aggregation
#   * edge_label_distances cutoff 1 -> 2: with cutoff 1 the bond-aware path
#     descriptor (distance, #paths, multiset of bond labels along the shortest
#     paths) collapses to "adjacent + bond type"
#   * betweenness_centrality heads (conv + aggregation) as a global signal
#
# Bigger label vocabularies grow the convolution weight count; control it with
# max_labels and by grid-searching rule_occurrence_threshold over [2, 5, 10].
