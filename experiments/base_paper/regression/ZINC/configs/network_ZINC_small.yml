# ZINC, Stage A + C of specs/09-zinc-readout-and-architecture-improvements.md.
#
# Same invariants as network_ZINC.yml, but the readout is shrunk where it is
# actually expensive: the readout costs H x F x out, and both H and F are
# config choices.
#   * aggr_channels linear: out_features 100 -> 32   (F)
#   * aggregation heads:    num 10 -> 4              (H: 140 -> 56)
#   * dropout before the readout (a `dropout` key on a linear layer is ignored)
# Readout: 56 x 32 = 1792 -> 100, i.e. ~179k instead of ~1.4M parameters.
#
# For the ~100k benchmark budget of the ZINC-subset protocol, drop the
# aggregation heads further to num: 2 (H = 28, readout 896 -> 100 = ~90k).
models:
- - layer_type: linear
    mode: aggr_features
    out_features: 4
    bias: true
    activation: torch.nn.LeakyReLU()
  - layer_type: layer_norm
  - layer_type: invariant_based_convolution
    bias: true
    activation: torch.nn.Identity()
    heads:
