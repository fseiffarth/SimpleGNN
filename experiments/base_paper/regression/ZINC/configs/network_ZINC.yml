# ZINC test network v2 (specs/15): identical to network_ZINC_test.yml except
# - the input MLP (2x linear one_hot->10) is replaced by an invariant-based
#   positional encoding acting as node encoder (concatenate_input: false ->
#   the learned embeddings ARE the node features). Its heads use exactly the
#   aggregation layer's 16 label configs, so all label files already exist
#   from the aggregation preprocessing (no new label generation). Per head:
#   `num` = learned entries per label value, same semantics as on aggregation
#   heads. A head contributes num features per node (one vector per node,
#   weights tied to the node's invariant value) -> 16 heads * num=2 = 32
#   input features.
# - the free-standing layer_norm before the convolution moves into the conv
#   as a transformer-style pre-norm residual block (residual + pre_layer_norm).
# Requires a `positional_encoding` entry under weight_initialization
# (see parameters_ZINC_test_v2.yml).
