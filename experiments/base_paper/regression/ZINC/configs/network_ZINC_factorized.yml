# ZINC, Stage B of specs/09-zinc-readout-and-architecture-improvements.md.
#
# Keeps the full capacity of the baseline (F = 100, H = 14 x 10 = 140) but
# stops flattening the graph embedding: `flatten: False` makes the aggregation
# layer emit (H, F) instead of an H*F vector, and the readout is a CP
# factorization of the (H, F, out) tensor,
#     W[h, f, o] = sum_r A[h, r] * B[f, r] * C[r, o],
# which costs rank x (H + F + out) = 32 x 340 = ~11k parameters instead of the
# 140 x 100 x 100 = 1.4M of the dense readout -- and it encodes the head/feature
# independence that the dense map is blind to.
models:
- - layer_type: linear
    mode: aggr_features
    out_features: 4
    bias: true
    activation: torch.nn.LeakyReLU()
  - layer_type: layer_norm
  - layer_type: invariant_based_convolution
    bias: true
    activation: torch.nn.Identity()
    heads:
    - num: 1
      bias: true
      labels:
        head:
          label_type: induced_cycles
          min_cycle_length: 6
          max_cycle_length: 6
        tail:
          label_type: induced_cycles
          min_cycle_length: 6
          max_cycle_length: 6
        bias:
          label_type: primary
      properties:
        name: distances
