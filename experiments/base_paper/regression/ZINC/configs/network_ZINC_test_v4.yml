# ZINC test network v4: architecture identical to network_ZINC_test_v2.yml EXCEPT
# the cycle-based node labels are replaced by closed-walk labels (diagonals of the
# adjacency powers). In v2 each length 5-10 contributed TWO heads (induced_cycles +
# simple_cycles); closed_walks has no induced/simple distinction, so each length
# 5-10 contributes ONE head using (A^k)_ii alone (min_walk_length == max_walk_length
# == k). This replaces the 12 cycle heads per layer with 6 closed-walk heads; the 4
# non-cycle heads (primary, wl_labeled, wl_labeled_edges depth 0/1) are unchanged.
# Everything else (pre-norm residual convolution, positional-encoding node encoder,
# distances, linear/aggregation/readout structure) matches v2 byte-for-byte.
#   closed_walks (A^k)_ii = number of closed walks of length k from a node = the
#   i-th diagonal of A^k; a spectral, per-node structural label capturing the local
#   cycle structure that 1-WL/degree cannot (length 3 -> triangles, 6 -> hexagons).
# Node-encoder AND convolution closed-walk heads use num=2 (so the two invariant
# message-passing stages have matching head counts); aggregation keeps v2's num=10.
# The WL/edge convolution heads keep their v2 num values (1 or 2).
models:
- - layer_type: invariant_based_positional_encoding
    concatenate_input: false
    heads:
    - num: 2
      labels:
        label_type:
        - closed_walks
        - primary
        min_walk_length: 5
        max_walk_length: 5
    - num: 2
      labels:
        label_type:
        - closed_walks
        - primary
        min_walk_length: 6
        max_walk_length: 6
    - num: 2
      labels:
        label_type:
        - closed_walks
        - primary
        min_walk_length: 7
        max_walk_length: 7
    - num: 2
