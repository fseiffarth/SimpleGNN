        - primary
        min_walk_length: 10
        max_walk_length: 10
    - num: 2
      labels:
        label_type: primary
    - num: 2
      labels:
        depth: 0
        label_type: wl_labeled
    - num: 2
      labels:
        depth: 0
        label_type: wl_labeled_edges
    - num: 2
