# ZINC graph-regression experiment: invariant-based positional encoding as node
# encoder (replacing the input MLP) and a pre-norm residual block on the
# convolution (specs/15). Promoted from the test_v2 configuration.
datasets:
  - {
      name: "ZINC",
      source: "ZINC",
      task: "graph_regression",
      validation_folds: 1,
      paths: {
        data: "data/ZINC/",
        labels: "data/ZINC/labels/",
        properties: "data/ZINC/properties/",
        results: "results/base_paper/regression/ZINC/",
        models: "experiments/base_paper/regression/ZINC/configs/network_ZINC.yml",
        hyperparameters: "experiments/base_paper/regression/ZINC/configs/parameters_ZINC.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ZINC_splits.json",
      }
  }
