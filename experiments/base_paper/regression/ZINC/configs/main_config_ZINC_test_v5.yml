# ZINC graph-regression test v5: fresh copy of the test_v2 configuration
# (invariant-based positional encoding as node encoder + pre-norm residual
# convolution, specs/15), i.e. currently identical to the promoted main ZINC
# config apart from the results directory. Starting point for the next
# variant; changes go into network_ZINC_test_v5.yml / parameters_ZINC_test_v5.yml.
datasets:
  - {
      name: "ZINC",
      source: "ZINC",
      task: "graph_regression",
      validation_folds: 1,
      paths: {
        data: "data/ZINC/",
        labels: "data/ZINC/labels/",
        properties: "data/ZINC/properties/",
        results: "results/base_paper/regression/ZINC_test_v5/",
        models: "experiments/base_paper/regression/ZINC/configs/network_ZINC_test_v5.yml",
        hyperparameters: "experiments/base_paper/regression/ZINC/configs/parameters_ZINC_test_v5.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ZINC_splits.json",
      }
  }
