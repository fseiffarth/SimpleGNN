# ZINC graph-regression test v10: exact test_v2 architecture and training
# configuration, except positional-encoding proximal L1 is disabled to isolate
# whether pruning the structural input embeddings hurts generalization.
datasets:
  - {
      name: "ZINC",
      source: "ZINC",
      task: "graph_regression",
      validation_folds: 1,
      paths: {
        data: "data/ZINC/",
        labels: "data/ZINC/labels/",
        properties: "data/ZINC/properties/",
        results: "results/base_paper/regression/ZINC_test_v10/",
        models: "experiments/base_paper/regression/ZINC/configs/network_ZINC_test_v10.yml",
        hyperparameters: "experiments/base_paper/regression/ZINC/configs/parameters_ZINC_test_v10.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ZINC_splits.json",
      }
  }
