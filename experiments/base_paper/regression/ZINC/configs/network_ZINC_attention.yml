# ZINC attention readout -- three variants of replacing the dense readout
# (14,000 -> 100, 1.4M parameters, ~80% of the model) with attention over the
# H = 140 aggregation-head embeddings (F = 100 each). The aggregation keeps
# its (H, F) structure via `flatten: False` and every variant adds a learned
# (H, F) head-identity embedding table (+14k params), since attention is
# otherwise permutation-invariant over the heads.
#
# The three models below are grid-searched by the framework:
#   gated        ABMIL gated attention pooling            ~37k readout params
#   pma          learned seed queries + multi-head attn   ~65k readout params
#   transformer  encoder block + gated pooling           ~118k readout params
