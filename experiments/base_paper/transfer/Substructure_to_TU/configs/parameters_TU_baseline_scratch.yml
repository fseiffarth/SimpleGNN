# No-pretrain baseline for the Substructure -> TU transfer experiment
# (spec 18). Byte-identical to parameters_transfer_TU_linear_probe.yml except
# that the transfer: block is absent: the same backbone
# (network_transfer_TU_finetune.yml) is trained from a fresh random init with
# nothing frozen. This is the reference point the linear-probe transfer run is
# compared against.
device: cpu
mode: experiments
precision: double

optimizer:
  - Adam
loss:
  - CrossEntropyLoss

batch_size:
  - 32
learning_rate:
  - 0.01
epochs:
  - 100

early_stopping:
  enabled: False
  patience: 50

csv_flush_interval: 1

training_data_sampling: { type: 'default' }

# kept identical to the transfer runs so the architectures match exactly.
input_features: { name: constant, in_dimensions: 1, value: 1.0 }

save_best_model: True
save_transfer_keys: False
