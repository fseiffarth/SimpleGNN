# NCI109 finetuning run of the ZINC -> TU hash-keyed transfer experiment
# (spec 18). Warm-started from the ZINC pretraining checkpoint via the
# transfer: block in parameters_transfer_TU_linear_probe.yml (hash-keyed
# invariant transfer, strategy: linear_probe, head re-initialized). Uses the
# same network_transfer_TU_finetune.yml as every other TU target so the
# exported per-head weight keys line up head-by-head.
datasets:
  - {
      name: "NCI109",
      source: "TUDataset",
      task: "graph_classification",
      validation_folds: 10,
      paths: {
        data: "data/TUDatasets/",
        labels: "data/TUDatasets/labels/",
        properties: "data/TUDatasets/properties/",
        results: "results/base_paper/transfer/ZINC_to_TU/finetune/",
        models: "experiments/base_paper/transfer/ZINC_to_TU/configs/network_transfer_TU_finetune.yml",
        hyperparameters: "experiments/base_paper/transfer/ZINC_to_TU/configs/parameters_transfer_TU_linear_probe.yml",
        splits: "src/simplegnn/datasets/splits/fair/NCI109_splits.json",
      }
  }
