# ZINC pretraining run of the ZINC -> TU hash-keyed transfer experiment
# (spec 18). save_best_model + save_transfer_keys in
# parameters_transfer_ZINC_pretrain.yml produce the checkpoint and .keys.pt
# sidecar that every TU finetuning run (main_config_MUTAG_finetune.yml,
# main_config_NCI1_finetune.yml, ...) transfers from.
datasets:
  - {
      name: "ZINC",
      source: "ZINC",
      task: "graph_regression",
      validation_folds: 1,
      paths: {
        data: "data/ZINC/",
        labels: "data/ZINC/labels/",
        properties: "data/ZINC/properties/",
        results: "results/base_paper/transfer/ZINC_to_TU/pretrain/",
        models: "experiments/base_paper/transfer/ZINC_to_TU/configs/network_transfer_ZINC_pretrain.yml",
        hyperparameters: "experiments/base_paper/transfer/ZINC_to_TU/configs/parameters_transfer_ZINC_pretrain.yml",
        splits: "src/simplegnn/datasets/splits/fixed/ZINC_splits.json",
      }
  }
