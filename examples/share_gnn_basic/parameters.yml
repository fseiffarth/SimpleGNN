# General options

device: cpu
# batched ShareGNN forward: process all graphs of a batch jointly (one matmul per
# invariant layer instead of one per graph) — enabled by default on GPU and CPU.
# Disable with share_gnn_forward: { batched: False } to use the per-graph forward.
# mode (auto|dense|sparse) picks the batched implementation; auto = padded dense
# on CPU, block-diagonal sparse on GPU. See specs/07-batched-share-gnn-forward.md
# share_gnn_forward: { batched: True }
mode: experiments # if debug printing and plotting options are enabled, for the experiments mode should be 'experiments'
precision: double

# network options

# optimizer: optimizer for the network
optimizer:
  - Adam

# loss: loss function for the network
loss:
  - CrossEntropyLoss

batch_size:
  - 32
learning_rate:
  - 0.01
epochs:
  - 100

early_stopping:
  enabled:
    False
  patience:
    30

# how to sample the training data
training_data_sampling: { type: 'default' } # undersampling, oversampling, default
#training_data_sampling: { type: 'default' } # undersampling, oversampling, default

input_features: {name: constant, value: 1.0, random_variation: { mean: 0.0, variance: 0.5 }}
#input_features: {name: node_labels, transformation: 'one_hot'}

save_best_model: True
#best_model: True
