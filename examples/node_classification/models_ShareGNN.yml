# ShareGNN model for node classification on Cora.
# One invariant-based message passing layer with symmetric degree
# normalization (weight sharing by degree labels and shortest-path distances
# up to 2) + dropout + linear readout to the 7 classes. No aggregation layer:
# node tasks keep one output row per node.
#
# With `degree_normalization: symmetric`, constant weight initialization and
# `convolution_grad: False` (see parameters.yml) the convolution is exactly a
# fixed SGC-style propagation D^-1/2 P D^-1/2 over the distance<=2 pattern P —
# on Cora this reaches ~78% validation accuracy. Setting
# `convolution_grad: True` makes the per-(degree, degree, distance) weights
# learnable again; then reduce/remove weight_decay, because the normalized
# weights receive ~deg-times smaller gradients and plain decay dominates.
models:
  - - { layer_type: invariant_based_convolution,
        activation: torch.nn.Identity(),
        bias: True,
        degree_normalization: symmetric,
        heads: [
          { num: 2,
            bias: True,
            labels: {
              head: { label_type: wl, depth: 0, max_labels: 20 },
              tail: { label_type: wl, depth: 0, max_labels: 20 },
              bias: { label_type: wl, depth: 0, max_labels: 20 },
            },
            properties: { name: distances, values: [ 0, 1, 2 ], cutoff: 2 },
          },
        ],
    }
    - { layer_type: dropout, p: 0.5 }
    - { layer_type: linear,
        out_features: 7,
        bias: True,
        activation: torch.nn.Identity(),
    }
