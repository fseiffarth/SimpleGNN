# Hyperparameters for ShareGNN node classification on Cora

device: cpu
mode: experiments
precision: float

optimizer:
  - Adam

loss:
  - CrossEntropyLoss

# one batch = the full training node set (140 nodes in the standard Cora split)
batch_size:
  - 140
learning_rate:
  - 0.05
weight_decay:
  - 0.0005
epochs:
  - 200

early_stopping:
  enabled:
    True
  patience:
    50

# row-normalized bag-of-words node attributes are the model input
input_features: { name: node_features, transformation: normalize_rows }

# constant initialization + degree_normalization (see models_ShareGNN.yml)
# makes the convolution start as a symmetric-normalized propagation
weight_initialization:
  convolution: { type: constant, value: 1.0 }
  convolution_bias: { type: constant, value: 0.0 }

# keep the convolution fixed at the normalized propagation and train only the
# readout: with 140 labeled nodes this generalizes clearly better (~78% vs
# ~64% validation accuracy). If set to True, drop weight_decay — the
# normalized weights get ~deg-times smaller gradients, so plain decay
# otherwise shrinks them to zero over training.
convolution_grad: False

save_best_model: True
